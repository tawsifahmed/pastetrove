name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like PasteTrove to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
      description: The problem it solves, or how you would use it.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How do you handle this today?
    validations:
      required: false
